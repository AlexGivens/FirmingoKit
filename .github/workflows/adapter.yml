name: SDK compiler adapter
on:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
# Explicitly provisioned Xcode 27.0/Swift 6.4 host; runner availability is a separate prerequisite.
jobs:
  package:
    runs-on: [self-hosted, macOS, ARM64, firmingo-xcode-27]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '22.12.0'
          package-manager-cache: false
      - name: Check toolchain and bundled resources
        run: |
          mkdir -p .build/adapter-ci
          xcodebuild -version 2>&1 | tee .build/adapter-ci/xcode.log
          swift --version 2>&1 | tee .build/adapter-ci/swift.log
          test "$(xcodebuild -version | head -1)" = 'Xcode 27.0'
          swift --version | grep -q 'Swift version 6.4'
          python3 Tools/ManagedWASM/update-resource-inventory.py --check 2>&1 | tee .build/adapter-ci/service-notices.log
      - name: SDK transport/protocol, compiler adapter, qualification fixtures and source-host checks
        run: node Tools/ManagedWASM/run-validation.mjs 2>&1 | tee .build/adapter-ci/tests.log
      - name: Explain qualification app asset boundary
        run: echo 'Host sources including bounded self-footprint, idle scene observation, explicit active-call/worker-phase lifecycle cancellation, production-deadline recovery and bounded macOS capsule export are type-checked with warnings as errors; twelve generator/runner/stress/lifecycle/deadline/export fixtures and the pinned workload inventory run without a compiler. Complete app builds/execution, workload calibration, actual 60-second deadline expiry, repeated builds, profiling, physical interruption and manual scene transitions need anchored prepared SDK bytes, signing and explicitly selected hosts/devices; these are deliberate CI exclusions until asset/runner provisioning. Local signed/physical evidence is separate.' >> "$GITHUB_STEP_SUMMARY"
      - name: Explain Nano hardware qualification boundary
        run: echo 'The same local entry point runs nine Nano tool fixtures, preparation syntax checks, admission/state/recovery-intent and reply-filter executables, a compile-only relay helper, and source-only ABI-one/FMS2 app checks. Actual local relay sockets require an explicit --loopback invocation; physical interruption, app termination, reply withholding and power-cycle checks require prepared assets/signing and a selected board. No hardware or local proxy listener runs in normal CI.' >> "$GITHUB_STEP_SUMMARY"
      - name: Explain initial-connection waiting coverage
        run: |
          echo 'Swift Testing exercises the FMS2 golden staging/one-shot commit/reconciliation and production TCP actor through injected platform callbacks: initial waiting/ready, original deadline, cancellation, terminal failure and established path loss. No socket, OS permission reset or automatic reconnect is used; fresh physical permission prompts remain separate qualification.' >> "$GITHUB_STEP_SUMMARY"
      - name: Explain ROM qualification host boundary
        run: echo 'The same validation entry point builds the explicit macOS ROM qualification host and tests command admission, exact Nano confirmation, changed-manifest rejection and preservation of existing evidence. No ROM mount, real UF2, programming, live socket or paused transfer is used by these tests. Signed host execution and physical power-loss/recovery remain separately selected experiments; direct iOS/iPadOS ROM programming is unavailable.' >> "$GITHUB_STEP_SUMMARY"
      - name: Compile maintained WebKit source-asset host and exercise address rejection without assets
        run: |
          mkdir -p .build/owned-service-webkit
          xcrun swiftc -swift-version 6 -enable-upcoming-feature ApproachableConcurrency -warnings-as-errors -parse-as-library -module-cache-path .build/owned-service-webkit/cache -target arm64-apple-macos14.0 Tools/ManagedWASM/VerifyBuiltServiceWebKit.swift -o .build/owned-service-webkit/VerifyBuiltServiceWebKit 2>&1 | tee .build/adapter-ci/built-host-compile.log
          .build/owned-service-webkit/VerifyBuiltServiceWebKit --check-inputs 2>&1 | tee .build/adapter-ci/built-host-inputs.log
          echo 'Owned development WASM qualification requires an explicit reviewed asset and compiler-maintenance harness; absent assets never count as execution.' >> "$GITHUB_STEP_SUMMARY"
      - name: Observe ABI-one and FMS2 real-runtime availability separately
        run: |
          env -u FIRMINGOKIT_WASM_MODULE swift test --disable-xctest --enable-swift-testing --filter ManagedWebKitCompilerTests 2>&1 | tee .build/adapter-ci/runtime.log
          echo 'Actual ABI-one/FMS2 WASM tests skip without the exact reviewed source-built service. Source/notice review is pinned, but no binary is bundled, fetched or published by this workflow.' >> "$GITHUB_STEP_SUMMARY"
      - name: Separate consumer discovers packaged resources
        run: |
          python3 Tools/ManagedWASM/make-resource-consumer.py
          swift run --package-path .build/compiler-resource-consumer ResourceConsumer 2>&1 | tee .build/adapter-ci/consumer.log
          echo 'Exact experimental Nano metadata is bundled; default compilation requires reviewed SDK preparation. This service-free job supplies no binary and claims no compiler execution.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: sdk-package-logs
          path: .build/adapter-ci/*.log
          if-no-files-found: warn
  apple-builds:
    runs-on: [self-hosted, macOS, ARM64, firmingo-xcode-27]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ios-simulator
            operation: build
            destination: generic/platform=iOS Simulator
          - name: ios-device
            operation: build
            destination: generic/platform=iOS
          - name: docc
            operation: docbuild
            destination: generic/platform=macOS
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check installed toolchain
        run: |
          mkdir -p .build/adapter-ci
          xcodebuild -version 2>&1 | tee .build/adapter-ci/xcode.log
          swift --version 2>&1 | tee .build/adapter-ci/swift.log
          test "$(xcodebuild -version | head -1)" = 'Xcode 27.0'
          swift --version | grep -q 'Swift version 6.4'
      - name: Build the SDK for the selected Apple destination
        run: xcodebuild '${{ matrix.operation }}' -workspace Validation/FirmingoKit.xcworkspace -scheme FirmingoKit -destination '${{ matrix.destination }}' -derivedDataPath '.build/adapter-ci-${{ matrix.name }}' CODE_SIGNING_ALLOWED=NO 2>&1 | tee '.build/adapter-ci/${{ matrix.name }}.log'
      - name: Compile optimized qualification-host sources against the iOS SDK without compiler assets or signing
        if: matrix.name == 'ios-device'
        run: |
          python3 -I -S -B Tools/ManagedWASM/check-compiler-host.py --ios-products .build/adapter-ci-ios-device/Build/Products/Debug-iphoneos 2>&1 | tee .build/adapter-ci/ios-host-typecheck.log
          python3 -I -S -B Tools/Hardware/check-nano-host.py --ios-products .build/adapter-ci-ios-device/Build/Products/Debug-iphoneos 2>&1 | tee .build/adapter-ci/ios-nano-host-typecheck.log
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: sdk-${{ matrix.name }}-logs
          path: .build/adapter-ci/*.log
          if-no-files-found: warn
